version: "3"
services:
  react-app:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      # The following environment variable is used to enable hot reloading~
      - CHOKIDAR_USEPOLLING=true
  react-app-tests:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      # The following environment variable is used to enable hot reloading~
      - CHOKIDAR_USEPOLLING=true
    command: npm run test:watch

